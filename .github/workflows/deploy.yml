name: Deploy Backend Only

on:
  push:
    branches: ["main"]
    paths:
      - "backend/**" # Só se mudar código Python
      - "docker-compose.yml" # Ou infraestrutura
      # Note que removemos mobile_app e updates.json daqui
  workflow_dispatch:

jobs:
  deploy_backend:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOMELAB_HOST }}
          username: ${{ secrets.HOMELAB_USER }}
          key: ${{ secrets.HOMELAB_SSH_KEY }}
          port: ${{ secrets.HOMELAB_PORT }}
          script: |
            cd ~/orfeu
            git pull origin main

            # Valida o compose e o .env ANTES de derrubar o que está no ar: se faltar
            # uma variável obrigatória (ex.: SECRET_KEY), o deploy para aqui e o site
            # continua de pé em vez de ficar sem containers.
            echo "🔎 Validando docker-compose e .env..."
            docker compose config -q || { echo "❌ Configuração inválida (veja o erro acima). Nada foi derrubado."; exit 1; }

            echo "🧹 Limpeza preventiva..."
            docker rm -f orfeu_backend orfeu_slskd orfeu_db orfeu_pgadmin orfeu_tunnel || true

            echo "🚀 Atualizando Backend..."
            docker compose up -d --build
            docker image prune -f
